name: Backup restore check (monthly)

# Once a month: the newest copy the nightly backup kept in R2 (database-backup.yml) is downloaded and restored into
# a throwaway PostgreSQL, the way it would be on the day it is needed. The nightly job already restores each copy
# before keeping it; this checks the other half: that a recent copy is in the bucket and comes back out whole with
# the account's token. The live database is not touched. A failure fails the run, and GitHub emails you.
on:
  schedule:
    - cron: "41 2 3 * *" # the 3rd of each month, 05:41 in Beirut
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: ecommerce-pro-backups
      MAX_AGE_DAYS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Check secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          # The same wrangler as the store's deploys, without installing the whole store.
          echo "WRANGLER=wrangler@$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")" >> "$GITHUB_ENV"

      # The nightly copies are named yallahaul-YYYY-MM-DD.dump (UTC): the newest from the last two days.
      - name: Download the newest nightly copy
        run: |
          for days in $(seq 0 "$MAX_AGE_DAYS"); do
            name="yallahaul-$(date -u -d "-$days days" +%Y-%m-%d).dump"
            if npx --yes "$WRANGLER" r2 object get "$BUCKET/$name" --file backup.dump --remote > get.log 2>&1 && [ -s backup.dump ]; then
              echo "NAME=$name" >> "$GITHUB_ENV"
              echo "Downloaded $name ($(stat -c %s backup.dump) bytes)."
              exit 0
            fi
          done
          tail -5 get.log
          echo "::error::No nightly copy from the last $MAX_AGE_DAYS days could be downloaded from $BUCKET: the daily backup may have stopped, or the token cannot read the bucket."
          exit 1

      - name: Restore it into a throwaway database
        run: |
          # The PostgreSQL version the copy was made from (the newest pg_restore can read any copy), restored into that version.
          major="$(docker run --rm -v "$PWD:/d" postgres:latest pg_restore --list /d/backup.dump | sed -n 's/^;[[:space:]]*Dumped from database version: \([0-9]*\).*/\1/p')"
          case "$major" in 1[4-9]|2[0-9]) ;; *) echo "::error::The copy could not be read: no database version in it."; exit 1 ;; esac
          echo "The copy was made from PostgreSQL $major."
          docker run -d --name restoredb -e POSTGRES_PASSWORD=restore "postgres:$major" > /dev/null
          for i in $(seq 1 30); do docker exec restoredb pg_isready -U postgres > /dev/null 2>&1 && break; sleep 2; done
          docker cp backup.dump restoredb:/backup.dump
          # As in the nightly check, pg_restore's complaints are shown, and what came back decides.
          docker exec restoredb pg_restore -U postgres -d postgres --no-owner --no-privileges /backup.dump 2> restore.err || { echo "pg_restore reported:"; tail -20 restore.err; }

      - name: Check what came back
        run: |
          q() { docker exec restoredb psql -U postgres -d postgres -Atc "$1" 2> /dev/null || echo 0; }
          tables="$(q "select count(*) from pg_tables where schemaname = 'public'")"
          migrations="$(q 'select count(*) from "_prisma_migrations" where finished_at is not null')"
          settings="$(q 'select count(*) from "Setting"')"
          staff="$(q "select count(*) from \"User\" where role::text <> 'CUSTOMER' and \"isActive\"")"
          products="$(q 'select count(*) from "Product"')"
          orders="$(q 'select count(*) from "Order"')"
          echo "$NAME restored: $tables tables, $migrations migrations, $settings settings, $staff staff accounts, $products products, $orders orders." | tee -a "$GITHUB_STEP_SUMMARY"
          bad=0
          [ "$tables" -ge 50 ] || { echo "::error::Only $tables tables came back."; bad=1; }
          [ "$migrations" -ge 1 ] || { echo "::error::The copy has no applied migrations."; bad=1; }
          [ "$settings" -ge 1 ] || { echo "::error::The copy has no settings."; bad=1; }
          [ "$staff" -ge 1 ] || { echo "::error::The copy has no active staff account to sign in with."; bad=1; }
          [ "$bad" = 0 ] && echo "The newest copy downloads and restores."
          exit "$bad"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install dependencies and bootstrap lockfile
        run: npm install --no-audit --no-fund

      - name: Commit generated lockfile
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already present"
          else
            git commit -m "chore: add npm lockfile"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Prisma generate
        run: npx prisma generate --schema=prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Backend audit
        run: npm run backend:audit

      - name: Build
        env:
          AUTH_SECRET: ci-build-only-secret-do-not-use-in-production
        run: npm run build

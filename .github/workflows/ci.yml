name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Backend audit
        run: npm run backend:audit

      - name: Dependency audit
        id: dependency-audit
        if: always()
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit.json
          audit_exit=$?
          echo "npm audit exit code: ${audit_exit}"
          echo ""
          echo "===== npm audit report ====="
          cat npm-audit.json
          echo "===== end npm audit report ====="

          if [ "$audit_exit" -eq 0 ]; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `npm audit` exits non-zero both when it finds real vulnerabilities and when
          # the registry's audit endpoint itself errors (e.g. npm retiring the legacy
          # "quick audit" endpoint returns a 400 with no vulnerability data at all, just
          # an HTTP-error-shaped JSON body) -- the latter is registry-side noise, not a
          # finding about this repo's dependencies, and must never fail every build (and
          # block every deploy) on its own. A real report always carries
          # `.metadata.vulnerabilities`; only fail the build on that shape.
          if node -e "const r = require('./npm-audit.json'); process.exit(r && r.metadata && r.metadata.vulnerabilities ? 0 : 1)" 2>/dev/null; then
            echo "result=vulnerabilities" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::npm audit did not return a usable vulnerability report (looks like a registry/API error, not a dependency finding) -- see the npm-audit-report artifact. Not failing the build on this."
            echo "result=inconclusive" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: error

      - name: Build (Cloudflare target)
        if: success()
        env:
          AUTH_SECRET: ci-build-only-secret-do-not-use-in-production
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: npm run build:cloudflare

      - name: Enforce dependency audit result
        if: steps.dependency-audit.outputs.result == 'vulnerabilities'
        run: |
          echo "Dependency audit found vulnerabilities. See the npm-audit-report artifact and the full JSON report above for exact package, advisory, severity, and dependency-path details."
          exit 1

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: quality
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Cloudflare credentials are configured
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repo secret is not set -- deploy cannot authenticate to Cloudflare. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check the database secret is configured
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          case "$NEON_DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::NEON_DATABASE_URL repo secret is missing or not a postgresql:// address -- the Worker would have no database."; exit 1 ;;
          esac

      # Build-time placeholders only (the same values the "quality" job builds with): the Worker
      # reads its real AUTH_SECRET (a persistent Cloudflare secret, per PRODUCTION-OPS.md) and
      # NEON_DATABASE_URL (uploaded with the version below) at runtime.
      - name: Build
        env:
          AUTH_SECRET: ci-build-only-secret-do-not-use-in-production
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: npm run build:cloudflare

      # Before the new code goes live, so it never runs against tables it doesn't know.
      # Migrations need Neon's direct (not pooled) address.
      - name: Apply database migrations
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: DATABASE_URL="${NEON_DATABASE_URL/-pooler./.}" npx prisma migrate deploy

      - name: Deploy
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The database address goes up with this version rather than as a separate secret
          # change, which would first restart the code that is currently live.
          secrets="$RUNNER_TEMP/worker-secrets.json"
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ NEON_DATABASE_URL: process.env.NEON_DATABASE_URL }))' "$secrets"
          npx opennextjs-cloudflare deploy -- --secrets-file "$secrets"
          rm -f "$secrets"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare MongoDB Prisma schema
        run: node scripts/prepare-mongodb-schema.mjs

      - name: Prisma generate (production MongoDB schema, Accelerate no-engine client)
        run: ./node_modules/.bin/prisma generate --no-engine --schema=prisma/mongodb-schema

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Backend audit
        run: npm run backend:audit

      - name: Dependency audit
        id: dependency-audit
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit.json
          audit_exit=$?
          echo "npm audit exit code: ${audit_exit}"
          echo ""
          echo "===== npm audit report ====="
          cat npm-audit.json
          echo "===== end npm audit report ====="
          exit ${audit_exit}

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: error

      - name: Build (Cloudflare target)
        if: success()
        env:
          AUTH_SECRET: ci-build-only-secret-do-not-use-in-production
          DATABASE_URL: mongodb://127.0.0.1:27017/ci-build
        run: npm run build:cloudflare

      - name: Enforce dependency audit result
        if: steps.dependency-audit.outcome == 'failure'
        run: |
          echo "Dependency audit found vulnerabilities. See the npm-audit-report artifact and the full JSON report above for exact package, advisory, severity, and dependency-path details."
          exit 1

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: quality
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Cloudflare credentials are configured
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repo secret is not set -- deploy cannot authenticate to Cloudflare. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # These are build-time placeholders only (the production values are already configured as
      # persistent Cloudflare Worker secrets via `wrangler secret put`, per PRODUCTION-OPS.md, and
      # are read from the Worker's real runtime env, not from this build step) -- same values the
      # "quality" job above already builds successfully with.
      - name: Deploy
        env:
          AUTH_SECRET: ci-build-only-secret-do-not-use-in-production
          DATABASE_URL: mongodb://127.0.0.1:27017/ci-build
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        run: npx prisma generate --schema=prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Backend audit
        run: npm run backend:audit

      - name: Build
        env:
          AUTH_SECRET: ci-build-only-secret-do-not-use-in-production
        run: npm run build

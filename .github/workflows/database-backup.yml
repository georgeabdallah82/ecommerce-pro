name: Database backup (daily)

# A copy of the whole store database (products, orders, customers, settings, theme) every night,
# kept 30 days in a private R2 bucket. Each copy is restored into a throwaway database in the same
# run and its row counts compared with the live database, so a copy that would not restore fails
# here (and GitHub emails the owner) instead of being found out on the day it is needed.
# Read-only on the live database. Neon's own instant restore covers only the last 6 hours on the
# free plan; this covers the last 30 days.
#
# To restore a copy: download it (wrangler r2 object get ecommerce-pro-backups/<name> --remote
# --file backup.dump) and pg_restore it into a new Neon branch or database, never over the live one
# without a decision to roll back.
on:
  schedule:
    - cron: "17 0 * * *" # 03:17 in Beirut
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: ecommerce-pro-backups
      KEEP_DAYS: "30"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Check secrets
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          case "$NEON_DATABASE_URL" in postgres://*|postgresql://*) ;; *) echo "::error::NEON_DATABASE_URL secret is missing"; exit 1 ;; esac
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          # The same wrangler as the store's deploys, without installing the whole store.
          echo "WRANGLER=wrangler@$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")" >> "$GITHUB_ENV"

      # pg_dump from the official image of the server's own major version (Neon's direct address,
      # not the pooler, as for migrations). The derived address is masked so it never shows in logs.
      - name: Copy the database
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          url="${NEON_DATABASE_URL/-pooler./.}"
          echo "::add-mask::$url"
          major="$(docker run --rm postgres:17 psql "$url" -Atc 'show server_version_num' | cut -c1-2)"
          case "$major" in 1[4-9]) ;; *) echo "::error::Could not read the database version"; exit 1 ;; esac
          echo "PG_MAJOR=$major" >> "$GITHUB_ENV"
          echo "Database: PostgreSQL $major"
          count_sql="select string_agg(format('%s=%s', c.relname, (xpath('/row/n/text()', query_to_xml(format('select count(*) as n from public.%I', c.relname), false, true, '')))[1]::text), ' ' order by c.relname) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relkind = 'r'"
          docker run --rm postgres:$major psql "$url" -Atc "$count_sql" | tr ' ' '\n' > live-before.txt
          docker run --rm -v "$PWD:/out" postgres:$major pg_dump "$url" --format=custom --no-owner --no-privileges --file /out/backup.dump
          docker run --rm postgres:$major psql "$url" -Atc "$count_sql" | tr ' ' '\n' > live-after.txt
          echo "COUNT_SQL=$count_sql" >> "$GITHUB_ENV"
          ls -l backup.dump

      # Restore into a throwaway PostgreSQL of the same version and compare row counts per table
      # with the live database, counted just before and just after the copy (an order placed
      # meanwhile can make either one differ, not both).
      - name: Check the copy restores
        run: |
          docker run -d --name restoredb -e POSTGRES_PASSWORD=restore postgres:$PG_MAJOR >/dev/null
          for i in $(seq 1 30); do docker exec restoredb pg_isready -U postgres >/dev/null 2>&1 && break; sleep 2; done
          docker cp backup.dump restoredb:/backup.dump
          docker exec restoredb pg_restore -U postgres -d postgres --no-owner --no-privileges /backup.dump 2> restore.err || { echo "pg_restore reported:"; tail -20 restore.err; }
          docker exec restoredb psql -U postgres -d postgres -Atc "$COUNT_SQL" | tr ' ' '\n' > restored.txt
          tables=0; bad=0
          while IFS='=' read -r table restored; do
            [ -n "$table" ] || continue
            tables=$((tables + 1))
            before="$(grep "^$table=" live-before.txt | cut -d= -f2)"; after="$(grep "^$table=" live-after.txt | cut -d= -f2)"
            if [ "$restored" != "$before" ] && [ "$restored" != "$after" ]; then
              echo "::error::$table: copy has $restored rows, live had $before before and $after after"; bad=$((bad + 1))
            fi
          done < restored.txt
          [ "$(grep -c . live-after.txt)" = "$tables" ] || { echo "::error::The copy has $tables tables, the live database $(grep -c . live-after.txt)"; bad=$((bad + 1)); }
          echo "Tables: $tables, rows per table:"; tr '\n' ' ' < restored.txt; echo
          [ "$bad" = 0 ] || exit 1
          echo "The copy restores with the same rows as the live database."

      - name: Keep the copy for ${{ env.KEEP_DAYS }} days in R2
        run: |
          # First run: create the private bucket and its 30-day expiry rule. Later runs find them
          # there; "already exists" is fine, any other failure shows up in the upload below.
          npx --yes "$WRANGLER" r2 bucket create "$BUCKET" > create.log 2>&1 || grep -qi "already exists" create.log || cat create.log
          npx --yes "$WRANGLER" r2 bucket lifecycle list "$BUCKET" > lifecycle.txt 2>&1 || true
          if ! grep -q "expire-old-backups" lifecycle.txt; then
            npx --yes "$WRANGLER" r2 bucket lifecycle add "$BUCKET" expire-old-backups --expire-days "$KEEP_DAYS" --force \
              || echo "::warning::Could not set the $KEEP_DAYS-day expiry on $BUCKET; old copies will be kept until it is set"
          fi
          name="yallahaul-$(date -u +%Y-%m-%d).dump"
          npx --yes "$WRANGLER" r2 object put "$BUCKET/$name" --file backup.dump --content-type application/octet-stream --remote
          echo "Saved $name ($(stat -c %s backup.dump) bytes) in $BUCKET; copies older than $KEEP_DAYS days are deleted automatically."

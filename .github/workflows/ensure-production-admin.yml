name: Ensure production admin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensure-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.MIGRATION_PRODUCTION_TARGET_DATABASE_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Verify admin provisioning secrets exist
        run: |
          test -n "$DATABASE_URL"
          case "$DATABASE_URL" in
            mongodb://*|mongodb+srv://*) ;;
            *) echo "DATABASE_URL must be a MongoDB connection string"; exit 1 ;;
          esac
          test -n "$ADMIN_EMAIL"
          test -n "$SEED_ADMIN_PASSWORD"
          test "${#SEED_ADMIN_PASSWORD}" -ge 8

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare MongoDB Prisma schema
        run: node scripts/prepare-mongodb-schema.mjs

      - name: Generate MongoDB Prisma client
        run: npx prisma generate --schema=prisma/mongodb-schema/schema.prisma

      - name: Ensure production admin
        run: npm run db:ensure-admin

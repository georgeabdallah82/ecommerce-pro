name: Ensure production admin

# Resets the store owner's admin login (ADMIN_EMAIL, password SEED_ADMIN_PASSWORD, full access,
# active, 2-step login off) in the store's database -- PostgreSQL on Neon since 2026-10-09.
# The way back in after losing the phone and the 2-step backup codes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensure-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Verify admin provisioning secrets exist
        run: |
          test -n "$NEON_DATABASE_URL"
          case "$NEON_DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "NEON_DATABASE_URL must be a PostgreSQL connection string"; exit 1 ;;
          esac
          test -n "$ADMIN_EMAIL"
          test -n "$SEED_ADMIN_PASSWORD"
          test "${#SEED_ADMIN_PASSWORD}" -ge 8

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Ensure production admin
        run: npm run db:ensure-admin

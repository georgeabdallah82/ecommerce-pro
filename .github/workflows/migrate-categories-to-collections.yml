name: Migrate categories to collections

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE-CATEGORIES to authorize this run against production
        required: true
        type: string
      dry_run:
        description: Preview only -- no writes (recommended for the first run)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'MIGRATE-CATEGORIES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.MIGRATION_PRODUCTION_TARGET_DATABASE_URL }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify target secret exists
        run: test -n "$DATABASE_URL"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare MongoDB Prisma schema
        run: node scripts/prepare-mongodb-schema.mjs

      - name: Generate MongoDB Prisma client
        run: npx prisma generate --schema=prisma/mongodb-schema

      - name: Run migration
        run: node scripts/migrate-categories-to-collections.mjs ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}

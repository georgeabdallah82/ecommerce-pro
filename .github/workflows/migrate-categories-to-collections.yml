name: Migrate categories to collections

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE-CATEGORIES to authorize this run against production
        required: true
        type: string
      dry_run:
        description: Preview only -- no writes (recommended for the first run)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'MIGRATE-CATEGORIES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.MIGRATION_PRODUCTION_TARGET_DATABASE_URL }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify target secret exists
        run: test -n "$DATABASE_URL"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare MongoDB Prisma schema
        run: node scripts/prepare-mongodb-schema.mjs

      - name: Generate MongoDB Prisma client
        run: npx prisma generate --schema=prisma/mongodb-schema

      - name: Run migration
        # inputs.dry_run is a real boolean (type: boolean above), not a string -- comparing it to the
        # string literal 'true' made GitHub Actions coerce both sides to numbers (true -> 1, 'true' -> NaN),
        # so `inputs.dry_run == 'true'` was ALWAYS false and --dry-run was never actually passed, regardless
        # of the checkbox. Confirmed live: a run invoked with dry_run: true still executed for real (created
        # a Collection and linked a product in production). Using the boolean directly in a truthy check
        # avoids the type-coercion trap entirely.
        run: node scripts/migrate-categories-to-collections.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

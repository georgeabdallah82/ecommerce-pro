name: MongoDB data migration validation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE-STAGING to authorize a disposable staging migration
        required: true
        type: string
      source_database_url:
        description: Optional override; normally leave empty to use MIGRATION_SOURCE_DATABASE_URL
        required: false
        type: string
      target_database_url:
        description: Optional override; normally leave empty to use MIGRATION_TARGET_DATABASE_URL
        required: false
        type: string

jobs:
  migrate-and-validate:
    if: ${{ inputs.confirmation == 'MIGRATE-STAGING' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/mongodb-production

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare MongoDB Prisma schema
        run: node scripts/prepare-mongodb-schema.mjs

      - name: Export PostgreSQL snapshot
        env:
          SOURCE_DATABASE_URL: ${{ inputs.source_database_url || secrets.MIGRATION_SOURCE_DATABASE_URL }}
        run: npm run db:migrate:export

      - name: Import into disposable staging MongoDB
        env:
          TARGET_DATABASE_URL: ${{ inputs.target_database_url || secrets.MIGRATION_TARGET_DATABASE_URL }}
        run: node scripts/migrate-postgres-to-mongodb.mjs import --replace-target

      - name: Validate staging data
        env:
          TARGET_DATABASE_URL: ${{ inputs.target_database_url || secrets.MIGRATION_TARGET_DATABASE_URL }}
        run: node scripts/validate-mongodb-migration.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Backend audit
        run: npm run backend:audit

      - name: Production build
        env:
          AUTH_SECRET: ci-migration-validation-only-secret
          DATABASE_URL: ${{ inputs.target_database_url || secrets.MIGRATION_TARGET_DATABASE_URL }}
        run: npm run build

      - name: Upload migration manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-migration-manifest
          path: .migration-tmp/manifest.json
          if-no-files-found: warn

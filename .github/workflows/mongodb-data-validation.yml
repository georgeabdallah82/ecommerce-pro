name: MongoDB data migration validation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type MIGRATE-STAGING to authorize the staging data copy'
        required: true
        type: string

jobs:
  migrate-staging:
    if: ${{ inputs.confirmation == 'MIGRATE-STAGING' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_DATABASE_URL: ${{ secrets.MIGRATION_SOURCE_DATABASE_URL }}
      TARGET_DATABASE_URL: ${{ secrets.MIGRATION_TARGET_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
      - name: Verify migration secrets exist
        run: |
          test -n "$SOURCE_DATABASE_URL"
          test -n "$TARGET_DATABASE_URL"
      - run: npm ci --no-audit --no-fund
      - name: Prepare MongoDB schema
        run: node scripts/prepare-mongodb-schema.mjs
      - name: Push MongoDB schema
        run: npx prisma db push --schema=prisma/mongodb-schema
      - name: Export PostgreSQL snapshot
        run: npm run db:migrate:export
      - name: Import snapshot into staging MongoDB
        run: npm run db:migrate:import -- --replace-target
      - name: Validate counts, checksums and references
        run: node scripts/validate-mongodb-migration.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Backend audit
        run: npm run backend:audit
      - name: Build
        env:
          AUTH_SECRET: ci-build-only-secret-do-not-use-in-production
          DATABASE_URL: ${{ secrets.MIGRATION_TARGET_DATABASE_URL }}
        run: npm run build

name: MongoDB production application smoke test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type SMOKE-TEST-MONGODB to authorize a read-only application smoke test'
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke-test:
    if: ${{ inputs.confirmation == 'SMOKE-TEST-MONGODB' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.MIGRATION_PRODUCTION_TARGET_DATABASE_URL }}
      AUTH_SECRET: smoke-test-only-secret
      NODE_ENV: production
      PORT: 10000
    steps:
      - name: Checkout controlled cutover branch
        uses: actions/checkout@v4
        with:
          ref: mongodb-production-cutover

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Verify MongoDB production target secret
        run: |
          test -n "$DATABASE_URL"
          node - <<'NODE'
          const url = new URL(process.env.DATABASE_URL)
          if (!['mongodb:', 'mongodb+srv:'].includes(url.protocol)) throw new Error('DATABASE_URL is not MongoDB')
          const db = decodeURIComponent(url.pathname.replace(/^\//, ''))
          if (!db || ['ecommerce_staging', 'staging', 'test', 'testing'].includes(db.toLowerCase())) {
            throw new Error(`Refusing smoke test database: ${db || '(empty)'}`)
          }
          console.log(`[smoke-test] target database: ${db}`)
          NODE

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare MongoDB Prisma schema
        run: node scripts/prepare-mongodb-schema.mjs

      - name: Generate MongoDB Prisma client
        run: npx prisma generate --schema=prisma/mongodb-schema

      - name: Build application against MongoDB
        run: npm run build

      - name: Start application
        run: |
          npm start > /tmp/ecommerce-mongodb-smoke.log 2>&1 &
          echo $! > /tmp/ecommerce-mongodb-smoke.pid

      - name: Wait for application health
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:10000/api/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ecommerce-mongodb-smoke.log
          exit 1

      - name: Verify read-only application endpoints
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:10000/api/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"database":"reachable"' /tmp/health.json

          curl --fail --silent --show-error http://127.0.0.1:10000/api/products >/tmp/products.json
          curl --fail --silent --show-error http://127.0.0.1:10000/api/reviews >/tmp/reviews.json
          curl --fail --silent --show-error http://127.0.0.1:10000/api/navigation >/tmp/navigation.json
          curl --fail --silent --show-error http://127.0.0.1:10000/api/store/settings >/tmp/settings.json

          node - <<'NODE'
          const fs = require('node:fs')
          for (const name of ['products', 'reviews', 'navigation', 'settings']) {
            const raw = fs.readFileSync(`/tmp/${name}.json`, 'utf8')
            JSON.parse(raw)
            console.log(`[smoke-test] ${name}: valid JSON`)
          }
          NODE

      - name: Stop application
        if: always()
        run: |
          if test -f /tmp/ecommerce-mongodb-smoke.pid; then kill $(cat /tmp/ecommerce-mongodb-smoke.pid) 2>/dev/null || true; fi
          if test -f /tmp/ecommerce-mongodb-smoke.log; then tail -200 /tmp/ecommerce-mongodb-smoke.log; fi

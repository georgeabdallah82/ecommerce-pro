name: MongoDB staging validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  mongodb-staging:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Initialize replica set
        run: |
          CONTAINER=$(docker ps -q --filter 'ancestor=mongo:8' | head -n 1)
          test -n "$CONTAINER"
          for i in {1..30}; do
            if docker exec "$CONTAINER" mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}) }"; then break; fi
            sleep 2
          done
      - name: Prepare MongoDB Prisma schema
        run: node scripts/prepare-mongodb-schema.mjs
      - name: Prisma generate
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/ecommerce_staging?replicaSet=rs0&directConnection=true
        run: npx prisma generate --schema=prisma/mongodb-schema
      - name: Prisma schema push
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/ecommerce_staging?replicaSet=rs0&directConnection=true
        run: npx prisma db push --schema=prisma/mongodb-schema
      - name: Typecheck
        run: npm run typecheck
      - name: Backend audit
        run: npm run backend:audit
      - name: Build
        env:
          AUTH_SECRET: ci-build-only-secret-do-not-use-in-production
          DATABASE_URL: mongodb://127.0.0.1:27017/ecommerce_staging?replicaSet=rs0&directConnection=true
        run: npm run build

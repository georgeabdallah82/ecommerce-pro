name: Database hours check (daily)

# Neon's free plan includes 100 compute hours a month and stops the database (and the store) when
# they run out. Every day this compares the hours used with that allowance and fails -- so the owner
# is alerted (check-alerts.yml) -- when the pace of the last days would use them all up before the
# month ends, or once 90% are used. Read-only on Neon (scripts/neon-usage.ts). Needs the NEON_API_KEY
# secret. Earlier days' readings are carried from one run to the next in GitHub's cache, so the pace
# follows the last days instead of the whole month (docs/hours-check-pace-2026-11.md).
on:
  schedule:
    - cron: "41 5 * * *" # 08:41 in Beirut
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Earlier readings
        uses: actions/cache/restore@v4
        with:
          path: neon-usage-history.json
          key: neon-usage-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: neon-usage-history-
      - name: Compare database hours with the monthly allowance
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_LIMIT_HOURS: "100"
          NEON_WARN_AT_PERCENT: "90"
          NEON_HISTORY_FILE: neon-usage-history.json
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/neon-usage.ts
      # Kept whether or not the check warns: tomorrow's pace is read from today's reading.
      - name: Keep today's reading
        if: always()
        uses: actions/cache/save@v4
        with:
          path: neon-usage-history.json
          key: neon-usage-history-${{ github.run_id }}-${{ github.run_attempt }}

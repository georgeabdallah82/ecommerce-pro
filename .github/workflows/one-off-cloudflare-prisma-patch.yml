name: One-off Cloudflare Prisma patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Patch Prisma runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/prisma.ts')
          text = path.read_text()

          if "@prisma/adapter-pg" not in text:
              text = text.replace(
                  "import { PrismaClient } from '@prisma/client'\n",
                  "import { PrismaClient } from '@prisma/client'\nimport { PrismaPg } from '@prisma/adapter-pg'\n",
                  1,
              )

          old = """try {\n  realPrisma = new PrismaClient()\n} catch {\n  console.warn('[AI Studio] Database client initialization warning — using resilient proxy')\n}"""
          new = """try {\n  const databaseUrl = process.env.DATABASE_URL || ''\n  if (/^postgres(?:ql)?:\\/\\//i.test(databaseUrl)) {\n    const adapter = new PrismaPg({\n      connectionString: databaseUrl,\n      maxUses: 1,\n    })\n    realPrisma = new PrismaClient({ adapter })\n  } else {\n    realPrisma = new PrismaClient()\n  }\n} catch {\n  console.warn('[AI Studio] Database client initialization warning — using resilient proxy')\n}"""

          if old not in text:
              raise SystemExit('Expected Prisma constructor block was not found; refusing to modify the file.')

          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify patch
        run: grep -n "PrismaPg\|maxUses" lib/prisma.ts

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/prisma.ts
          git commit -m "fix: use PrismaPg adapter on Cloudflare Workers"
          git push

name: One-off MongoDB production architecture cutover

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cutover:
    if: contains(github.event.head_commit.message, 'MongoDB production architecture cutover')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Switch production runtime to MongoDB
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          # package.json: MongoDB is the production datasource. Keep the
          # PostgreSQL migration utilities in the repo, but remove the runtime
          # pg adapter from the application bundle.
          p = Path('package.json')
          data = json.loads(p.read_text())
          data['scripts']['build'] = 'node scripts/prepare-mongodb-schema.mjs && prisma generate --schema=prisma/mongodb-schema && next build'
          data['scripts']['db:push'] = 'node scripts/prepare-mongodb-schema.mjs && prisma db push --schema=prisma/mongodb-schema'
          data['scripts']['db:deploy'] = 'node scripts/prepare-mongodb-schema.mjs && prisma db push --schema=prisma/mongodb-schema'
          for key in ['@prisma/adapter-pg', 'pg']:
              data['dependencies'].pop(key, None)
          data['devDependencies'].pop('@types/pg', None)
          p.write_text(json.dumps(data, indent=2) + '\n')

          # CI should generate the same Prisma client that production runs.
          p = Path('.github/workflows/ci.yml')
          text = p.read_text()
          text = text.replace(
              '      # The application uses the primary PostgreSQL Prisma schema. MongoDB\n      # migration validation has its own dedicated workflows and must not be\n      # mixed into the normal application build, because prepare-mongodb-schema\n      # creates duplicate Prisma models alongside prisma/schema.prisma.\n      - name: Prisma generate (application schema)\n        run: npx prisma generate\n',
              '      - name: Prepare MongoDB Prisma schema\n        run: node scripts/prepare-mongodb-schema.mjs\n\n      - name: Prisma generate (production MongoDB schema)\n        run: npx prisma generate --schema=prisma/mongodb-schema\n'
          )
          text = text.replace('DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci-build', 'DATABASE_URL: mongodb://127.0.0.1:27017/ci-build')
          p.write_text(text)

          # Runtime client: remove PostgreSQL adapter construction. The client
          # generated above is now the MongoDB Prisma client.
          p = Path('lib/prisma.ts')
          text = p.read_text()
          text = text.replace("import { PrismaPg } from '@prisma/adapter-pg'\n", '')
          old = '''try {\n  const databaseUrl = process.env.DATABASE_URL || ''\n  if (/^postgres(?:ql)?:\\/\\//i.test(databaseUrl)) {\n    const adapter = new PrismaPg({\n      connectionString: databaseUrl,\n      maxUses: 1,\n    })\n    realPrisma = new PrismaClient({ adapter })\n  } else {\n    realPrisma = new PrismaClient()\n  }\n} catch {\n  console.warn('[AI Studio] Database client initialization warning — using resilient proxy')\n}'''
          new = '''try {\n  realPrisma = new PrismaClient()\n} catch {\n  console.warn('[AI Studio] Database client initialization warning — using resilient proxy')\n}'''
          if old not in text:
              raise SystemExit('Expected PrismaPg runtime block was not found; refusing to continue.')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Verify production schema can generate
        run: |
          node scripts/prepare-mongodb-schema.mjs
          npx prisma validate --schema=prisma/mongodb-schema
          npx prisma generate --schema=prisma/mongodb-schema

      - name: Commit MongoDB architecture
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .github/workflows/ci.yml lib/prisma.ts
          git commit -m "feat: make MongoDB the production datasource"
          git push

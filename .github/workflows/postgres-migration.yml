name: PostgreSQL migration (MongoDB -> Neon)

# Moves the store off MongoDB + Prisma Accelerate (retired by Prisma on 2026-12-01) onto Neon
# PostgreSQL. MongoDB is only read. scripts/migrate-mongodb-to-postgres.mjs does the copy and
# refuses to overwrite a database the store is already running on.
#
# rehearsal: copy + fingerprint check, then build the PostgreSQL version of the store (app_ref),
#            run it against the copy and drive it end to end with a browser
#            (scripts/e2e/write-path.mjs). run_on = local runs it on this runner (wrangler dev);
#            run_on = cloudflare-preview uploads it to the live Worker as a version that is NOT
#            deployed and tests its private preview URL: real Cloudflare limits and the live
#            Worker's real settings (whose NEON_DATABASE_URL is the copy). Customers keep getting the
#            deployed version either way.
# final:     the switch-over copy. Needs maintenance mode on and the typed confirmation.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "rehearsal (practice copy + full test) or final (switch-over copy)"
        type: choice
        options: [rehearsal, final]
        default: rehearsal
      confirmation:
        description: "Final -- type COPY-PRODUCTION. Rehearsal after a rolled-back switch-over -- type DISCARD-NEON-AFTER-ROLLBACK"
        required: false
        type: string
      app_ref:
        description: "Rehearsal only -- branch whose PostgreSQL version of the store is tested (default: this run's branch)"
        required: false
        type: string
      run_on:
        description: "Rehearsal only -- local (wrangler dev on the runner) or cloudflare-preview (an uploaded, not deployed, version of the live Worker)"
        type: choice
        options: [local, cloudflare-preview]
        default: local

permissions:
  contents: read

concurrency:
  group: postgres-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MONGODB_URL: ${{ secrets.MIGRATION_PRODUCTION_TARGET_DATABASE_URL }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Check inputs and secrets
        run: |
          if [ "${{ inputs.mode }}" = "final" ] && [ "${{ inputs.confirmation }}" != "COPY-PRODUCTION" ]; then
            echo "::error::Final copy needs the confirmation COPY-PRODUCTION"; exit 1
          fi
          test -n "$MONGODB_URL" || { echo "::error::Secret MIGRATION_PRODUCTION_TARGET_DATABASE_URL (the MongoDB store) is missing"; exit 1; }
          test -n "$NEON_DATABASE_URL" || { echo "::error::Secret NEON_DATABASE_URL is missing"; exit 1; }
          case "$NEON_DATABASE_URL" in postgres://*|postgresql://*) ;; *) echo "::error::NEON_DATABASE_URL must start with postgresql://"; exit 1 ;; esac
          # Migrations and the copy need a direct connection; the app uses the pooled one.
          echo "TARGET_DATABASE_URL=${NEON_DATABASE_URL/-pooler./.}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Create / update the PostgreSQL tables
        run: DATABASE_URL="$TARGET_DATABASE_URL" npx prisma migrate deploy

      - name: Rehearsal login for the e2e test
        if: inputs.mode == 'rehearsal'
        run: |
          password="$(openssl rand -base64 24 | tr -d '/+=')Aa1!"
          echo "::add-mask::$password"
          echo "E2E_ADMIN_EMAIL=rehearsal-e2e@yallahaul.test" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Copy MongoDB -> PostgreSQL and verify
        run: |
          flags=""
          if [ "${{ inputs.mode }}" = "rehearsal" ] && [ "${{ inputs.confirmation }}" = "DISCARD-NEON-AFTER-ROLLBACK" ]; then flags="--discard-after-rollback"; fi
          node scripts/migrate-mongodb-to-postgres.mjs --mode "${{ inputs.mode }}" $flags

      - name: Product for the e2e checkout
        if: inputs.mode == 'rehearsal'
        run: echo "PRODUCT_PATH=$(node -p "require('./.migration-tmp/e2e.json').productPath")" >> "$GITHUB_ENV"

      # ---- Rehearsal: run the PostgreSQL version of the store against the copy ----------------
      - name: Check out the store to test
        if: inputs.mode == 'rehearsal'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_ref || github.ref_name }}
          path: app

      - name: Build the store (Cloudflare target)
        if: inputs.mode == 'rehearsal'
        working-directory: app
        env:
          AUTH_SECRET: ci-build-only-secret-do-not-use-in-production
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: |
          npm ci --no-audit --no-fund
          npm run build:cloudflare

      - name: Start the store against the rehearsal copy
        if: inputs.mode == 'rehearsal' && inputs.run_on != 'cloudflare-preview'
        working-directory: app
        # The same settings the live Worker has, with throwaway values: the retired Accelerate address
        # it still carries in DATABASE_URL (Prisma refuses to start if it reads that next to a driver
        # adapter), cron/webhook secrets and push keys (the copy holds no push subscriptions).
        run: |
          cron_secret="$(openssl rand -hex 24)"
          echo "::add-mask::$cron_secret"
          echo "CRON_SECRET=$cron_secret" >> "$GITHUB_ENV"
          vapid="$(npx --no-install web-push generate-vapid-keys --json)"
          {
            echo "NEON_DATABASE_URL=$NEON_DATABASE_URL"
            echo "DATABASE_URL=prisma://accelerate.prisma-data.net/?api_key=rehearsal-placeholder"
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:8787"
            echo "CRON_SECRET=$cron_secret"
            echo "PAYMENT_WEBHOOK_SECRET=$(openssl rand -hex 24)"
            echo "VAPID_PUBLIC_KEY=$(node -p 'JSON.parse(process.argv[1]).publicKey' "$vapid")"
            echo "VAPID_PRIVATE_KEY=$(node -p 'JSON.parse(process.argv[1]).privateKey' "$vapid")"
            echo "VAPID_SUBJECT=mailto:rehearsal@yallahaul.test"
          } > .dev.vars
          nohup npx wrangler dev --port 8787 --ip 127.0.0.1 > ../wrangler.log 2>&1 &
          for i in $(seq 1 90); do grep -q "Ready on" ../wrangler.log && exit 0; sleep 2; done
          cat ../wrangler.log; exit 1

      # (OpenNext hands these arguments to a shell unquoted: keep the message free of spaces and brackets.)
      # The preview runs with the live Worker's own settings (its CRON_SECRET is not known here, so
      # the e2e skips the steps that need it). Preview URLs are switched on for this upload only;
      # the repository's wrangler.jsonc keeps them off, so the next real deploy turns them off again.
      - name: Upload the store to Cloudflare as a preview version (not deployed)
        if: inputs.mode == 'rehearsal' && inputs.run_on == 'cloudflare-preview'
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e 'const f="wrangler.jsonc",fs=require("fs"),c=JSON.parse(fs.readFileSync(f,"utf8"));c.preview_urls=true;fs.writeFileSync(f,JSON.stringify(c,null,2))'
          npx opennextjs-cloudflare upload -- --message postgres-rehearsal-preview-not-deployed 2>&1 | tee ../upload.log
          url="$(grep -o 'Version Preview URL: https://[^ ]*' ../upload.log | head -1 | sed 's/Version Preview URL: //')"
          version="$(grep -o 'Worker Version ID: [0-9a-f-]*' ../upload.log | head -1 | sed 's/Worker Version ID: //')"
          if [ -z "$url" ] || [ -z "$version" ]; then echo "::error::Cloudflare did not return a preview URL and version"; exit 1; fi
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "PREVIEW_VERSION=$version" >> "$GITHUB_ENV"
          # The preview version's own log (live traffic runs another version and is not included).
          nohup npx wrangler tail ecommerce-pro --version-id "$version" --format json > ../tail.log 2> ../tail.err &
          for i in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' "$url/api/health")" = 200 ] && { sleep 5; exit 0; }; sleep 5; done
          echo "::error::The preview version did not answer"; exit 1

      - name: End-to-end test (browser)
        if: inputs.mode == 'rehearsal'
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1
          npx playwright-core install --with-deps chromium
          BASE="${PREVIEW_URL:-http://127.0.0.1:8787}" ADMIN_EMAIL="$E2E_ADMIN_EMAIL" ADMIN_PASSWORD="$E2E_ADMIN_PASSWORD" node scripts/e2e/write-path.mjs

      - name: Preview version log (failed requests and errors only)
        if: always() && inputs.mode == 'rehearsal' && inputs.run_on == 'cloudflare-preview'
        run: |
          sleep 10
          echo "events logged: $(grep -c '"outcome"' tail.log || true)"
          jq -c 'select(.outcome != "ok" or ((.event.response.status // 200) >= 500) or ((.exceptions // []) | length > 0) or ([(.logs // [])[] | select(.level == "error")] | length > 0)) | {url: .event.request.url, status: .event.response.status, outcome, exceptions: [(.exceptions // [])[] | ((.name // "") + ": " + ((.message // "") | tostring))[0:400]], errors: [(.logs // [])[] | select(.level == "error") | (.message | tostring)[0:600]]}' tail.log | head -40 || true
          tail -5 tail.err || true

      - name: Store log (errors only)
        if: always() && inputs.mode == 'rehearsal' && inputs.run_on != 'cloudflare-preview'
        run: grep -E "ERROR|Error|Warning|hung|different request| 5[0-9][0-9] " wrangler.log | grep -v "Duplicate key" | head -80 || true

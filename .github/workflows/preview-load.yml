name: Launch traffic test (hidden preview)

# How many shoppers at once the store copes with on Cloudflare: builds app_ref, uploads it to the
# live Worker as a version that is NOT deployed (customers keep getting the deployed one) and sends
# simulated shoppers with real browsers to that version's private preview URL, in steps of more
# shoppers at once. The preview runs with the live Worker's settings, so it reads the live
# database: the test only browses (no account, no cart, visitor beacon blocked) and never touches
# the live store's own address.
on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Branch to test (default: this run's branch)"
        required: false
        default: ""
      shoppers:
        description: "Shoppers at once, per step"
        required: false
        default: "1,3,6,10"
      step_minutes:
        description: "Minutes per step"
        required: false
        default: "2"

permissions:
  contents: read

concurrency:
  group: preview-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Build the store (Cloudflare target)
        env:
          AUTH_SECRET: ci-build-only-secret-do-not-use-in-production
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: |
          npm ci --no-audit --no-fund
          npm run build:cloudflare

      # Preview URLs are a Worker-wide switch that real deploys turn off (wrangler.jsonc keeps them
      # off): on for the length of this test only, then off again in the last step. workers.dev --
      # the live store's address -- stays on throughout.
      - name: Switch on preview URLs for the test
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ecommerce-pro/subdomain"
          before="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Cloudflare-Workers-Script-Api-Date: 2025-08-01' "$api")"
          echo "before: $(jq -c '.result' <<<"$before")"
          [ "$(jq -r '.result.enabled' <<<"$before")" = true ] || { echo "::error::workers.dev is not on for the Worker; not touching its settings"; exit 1; }
          echo "PREVIEWS_SWITCHED=1" >> "$GITHUB_ENV"
          after="$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -H 'Cloudflare-Workers-Script-Api-Date: 2025-08-01' --data '{"enabled":true,"previews_enabled":true}' "$api")"
          echo "after: $(jq -c '.result' <<<"$after")"
          [ "$(jq -r '.result.enabled' <<<"$after")" = true ] && [ "$(jq -r '.result.previews_enabled' <<<"$after")" = true ] || { echo "::error::Cloudflare did not switch on preview URLs"; exit 1; }

      # (OpenNext hands these arguments to a shell unquoted: keep the message free of spaces and brackets.)
      - name: Upload the store to Cloudflare as a preview version (not deployed)
        run: |
          node -e 'const f="wrangler.jsonc",fs=require("fs"),c=JSON.parse(fs.readFileSync(f,"utf8"));c.preview_urls=true;fs.writeFileSync(f,JSON.stringify(c,null,2))'
          npx opennextjs-cloudflare upload -- --message launch-traffic-test-preview-not-deployed --var REHEARSAL_ERROR_DETAILS:1 2>&1 | tee upload.log
          url="$(grep -o 'Version Preview URL: https://[^ ]*' upload.log | head -1 | sed 's/Version Preview URL: //')"
          version="$(grep -o 'Worker Version ID: [0-9a-f-]*' upload.log | head -1 | sed 's/Worker Version ID: //')"
          if [ -z "$url" ] || [ -z "$version" ]; then echo "::error::Cloudflare did not return a preview URL and version"; exit 1; fi
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "PREVIEW_VERSION=$version" >> "$GITHUB_ENV"
          echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          # The Worker's log for requests from this runner only (customers' requests are not included).
          nohup npx wrangler tail ecommerce-pro --ip self --format json > tail.log 2> tail.err &
          for i in $(seq 1 30); do grep -qi "connected\|waiting for logs" tail.log tail.err 2>/dev/null && break; sleep 2; done
          for i in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' "$url/api/health")" = 200 ] && exit 0; sleep 5; done
          echo "::error::The preview version did not answer"; exit 1

      - name: Simulated shoppers
        env:
          SHOPPERS: ${{ inputs.shoppers }}
          STEP_MINUTES: ${{ inputs.step_minutes }}
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1
          npx playwright-core install --with-deps chromium
          node scripts/e2e/browse-load.mjs "$PREVIEW_URL"

      - name: Cloudflare's view of the preview version
        if: always() && env.PREVIEW_VERSION != ''
        run: |
          # Cloudflare's own statistics for the preview version (read-only): outcome, CPU and wall time.
          sleep 60
          until="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          query='query($acct: string!, $since: Time!, $until: Time!, $version: string!) { viewer { accounts(filter: {accountTag: $acct}) { workersInvocationsAdaptive(limit: 20, filter: {scriptName: "ecommerce-pro", scriptVersion: $version, datetime_geq: $since, datetime_leq: $until}) { sum { requests errors subrequests } quantiles { cpuTimeP50 cpuTimeP90 cpuTimeP99 wallTimeP50 wallTimeP99 } dimensions { status } } } } }'
          jq -n --arg q "$query" --arg acct "$CLOUDFLARE_ACCOUNT_ID" --arg since "$STARTED_AT" --arg until "$until" --arg version "$PREVIEW_VERSION" '{query: $q, variables: {acct: $acct, since: $since, until: $until, version: $version}}' \
            | curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data @- https://api.cloudflare.com/client/v4/graphql \
            | jq -c '.errors // .data.viewer.accounts[0].workersInvocationsAdaptive[]' || true
          echo "events logged: $(grep -c '"outcome"' tail.log || true)"
          jq -c 'select(.outcome != "ok" or ((.event.response.status // 200) >= 500) or ((.exceptions // []) | length > 0) or ([(.logs // [])[] | select(.level == "error")] | length > 0)) | {url: .event.request.url, status: .event.response.status, outcome, exceptions: [(.exceptions // [])[] | ((.name // "") + ": " + ((.message // "") | tostring))[0:400]], errors: [(.logs // [])[] | select(.level == "error") | (.message | tostring)[0:600]]}' tail.log | head -40 || true
          echo "--- outcomes:"; jq -r '.outcome' tail.log 2>/dev/null | sort | uniq -c || true
          echo "--- tail messages:"; grep -v '^\s*$' tail.err | head -10 || true

      - name: Switch preview URLs off again
        if: always() && env.PREVIEWS_SWITCHED == '1'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ecommerce-pro/subdomain"
          after="$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -H 'Cloudflare-Workers-Script-Api-Date: 2025-08-01' --data '{"enabled":true,"previews_enabled":false}' "$api")"
          echo "after: $(jq -c '.result' <<<"$after")"
          [ "$(jq -r '.result.enabled' <<<"$after")" = true ] && [ "$(jq -r '.result.previews_enabled' <<<"$after")" = false ] || { echo "::error::Preview URLs may still be on: check Workers > ecommerce-pro > Settings > Domains & Routes"; exit 1; }

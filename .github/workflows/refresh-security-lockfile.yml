name: Refresh security lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify only lockfile changed
        run: |
          changed=$(git diff --name-only)
          test "$changed" = "package-lock.json"

      - name: Commit generated lockfile and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-security-lockfile.yml
          git rm .github/workflows/refresh-security-lockfile.yml
          git commit -m "chore: refresh lockfile for security override"
          git push

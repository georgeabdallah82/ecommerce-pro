name: Repair theme editor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and fix theme editor
        run: |
          git checkout a56fd9c24df92c2b605f914fae83a4f3ea60985a -- components/pro-theme-editor.tsx
          python - <<'PY'
          from pathlib import Path
          p = Path('components/pro-theme-editor.tsx')
          s = p.read_text()
          s = s.replace("const previewTheme=useMemo(()=>({...theme,editorTemplates:{...(theme.editorTemplates||{}),Pages:current}},[theme,current]);", "const previewTheme=useMemo(()=>({...theme,editorTemplates:{...(theme.editorTemplates||{}),Pages:current}}),[theme,current]);")
          s = s.replace("if(page==='Product page')", "if(page==='Product')")
          s = s.replace("if(page==='Collection page')", "if(page==='Collection')")
          p.write_text(s)
          PY
          rm .github/workflows/repair-theme-editor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/pro-theme-editor.tsx .github/workflows/repair-theme-editor.yml
          git commit -m "Restore and fix theme editor build"
          git push

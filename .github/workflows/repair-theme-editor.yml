name: Repair theme editor
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply theme editor and template fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old in s:
                  p.write_text(s.replace(old,new,1)); print('updated',path)
              else:
                  print('pattern not found', path)

          # Product API: include collection membership for editor filtering.
          p=Path('app/api/products/route.ts'); s=p.read_text()
          s=s.replace("tags: true,\n      },", "tags: true,\n        collections: { include: { collection: true } },\n      },")
          p.write_text(s)

          # Theme editor: expose collection selectors and sync collection/product data.
          p=Path('components/pro-theme-editor.tsx'); s=p.read_text()
          s=s.replace("type CatalogProduct = { id: string; name: string; slug?: string; basePrice: number; images?: { url: string }[] }", "type CatalogProduct = { id: string; name: string; slug?: string; basePrice: number; images?: { url: string }[]; collections?: { collection: { id: string; slug: string; name?: string } }[] }")
          s=s.replace("if (type.includes('product')) return { id: id(type), type, enabled: true, settings: { ...common, heading:", "if (type === 'main_product') return { id: id(type), type, enabled: true, settings: { ...common, heading: '', collection: '' }, blocks: [] }\n  if (type.includes('product')) return { id: id(type), type, enabled: true, settings: { ...common, heading:")
          s=s.replace("'Product': [section('announcement'), section('header'), section('featured_product'), section('product_recommendations'), section('newsletter'), section('footer')],", "'Product': [section('announcement'), section('header'), section('main_product'), section('product_recommendations'), section('newsletter'), section('footer')],")
          s=s.replace("if (type.includes('collection')) return { id: id(type), type, enabled: true, settings: { ...common, heading:", "if (type === 'main_collection') return { id: id(type), type, enabled: true, settings: { ...common, heading: 'Collection', subheading: '', limit: 24, columns: 4, sourceCollection: '' }, blocks: [] }\n  if (type.includes('collection')) return { id: id(type), type, enabled: true, settings: { ...common, heading:")
          s=s.replace("main_collection_banner: { label: 'Collection banner'", "main_product: { label: 'Main product', category: 'Products', description: 'The main product details section for product templates.' },\n  main_collection: { label: 'Main collection', category: 'Collections', description: 'Collection details and product grid driven by the current collection.' },\n  main_collection_banner: { label: 'Collection banner'")
          s=s.replace("const ADDABLE = Object.keys(META).filter(k => k !== 'header')", "const ADDABLE = Object.keys(META).filter(k => k !== 'header')")
          # Select supports labeled object options.
          old="function Select({ label, value, options, onChange }: { label: string; value: string; options: string[]; onChange: (v: string) => void }) { return <label className=\"pteField\"><span>{label}</span><select value={value} onChange={e => onChange(e.target.value)}>{options.map(o => <option key={o} value={o}>{o}</option>)}</select></label> }"
          new="function Select({ label, value, options, onChange }: { label: string; value: string; options: (string | {value:string;label:string})[]; onChange: (v: string) => void }) { return <label className=\"pteField\"><span>{label}</span><select value={value} onChange={e => onChange(e.target.value)}>{options.map(o => { const v=typeof o==='string'?o:o.value; const l=typeof o==='string'?o:o.label; return <option key={v} value={v}>{l}</option> })}</select></label> }"
          if old in s: s=s.replace(old,new,1)
          # Inspector receives collections.
          s=s.replace("function Inspector({ section, tab, update, addBlock, patchBlock, removeBlock, chooseAsset }: { section: Section; tab: DrawerTab; update: (p: AnyMap) => void; addBlock: (type: string) => void; patchBlock: (id: string, p: AnyMap) => void; removeBlock: (id: string) => void; chooseAsset: (target: MediaTarget) => void }) {", "function Inspector({ section, tab, update, addBlock, patchBlock, removeBlock, chooseAsset, collections }: { section: Section; tab: DrawerTab; update: (p: AnyMap) => void; addBlock: (type: string) => void; patchBlock: (id: string, p: AnyMap) => void; removeBlock: (id: string) => void; chooseAsset: (target: MediaTarget) => void; collections: CatalogCollection[] }) {")
          # Product panel: collection source selector.
          s=s.replace("<Toggle label=\"Show view all\" value={s.showViewAll !== false} onChange={v => update({ showViewAll: v })}/></Panel>}", "<Select label=\"Collection\" value={s.collection || ''} options={[{value:'',label:'All products'}, ...collections.map(c => ({value:c.slug,label:c.name}))]} onChange={v => update({ collection: v })}/><Toggle label=\"Show view all\" value={s.showViewAll !== false} onChange={v => update({ showViewAll: v })}/></Panel>}",1)
          # Collection panel: choose collections and source collection for collection template.
          s=s.replace("<div className=\"pteTwo\"><Range label=\"Collections\" value={Number(s.limit || 4)} min={1} max={12} step={1} onChange={v => update({ limit: v })}/><Range label=\"Columns\" value={Number(s.columns || 4)} min={1} max={6} step={1} onChange={v => update({ columns: v })}/></div></Panel>}", "<Select label=\"Display source\" value={s.sourceCollection || ''} options={[{value:'',label:'All collections'}, ...collections.map(c => ({value:c.slug,label:c.name}))]} onChange={v => update({ sourceCollection: v })}/><div className=\"pteTwo\"><Range label=\"Collections\" value={Number(s.limit || 4)} min={1} max={12} step={1} onChange={v => update({ limit: v })}/><Range label=\"Columns\" value={Number(s.columns || 4)} min={1} max={6} step={1} onChange={v => update({ columns: v })}/></div><div className=\"pteMini\">For a Collection List, choose a source to show that collection first. For the Collection template, choose the current collection from the template preview.</div></Panel>}",1)
          # Main product / main collection panels.
          marker="{section.type === 'image_with_text' && <Panel title=\"Content\">"
          insert="{section.type === 'main_product' && <Panel title=\"Main product\"><Select label=\"Preview product\" value={s.previewProductId || ''} options={[{value:'',label:'First active product'}, ...productsForInspectorPlaceholder]} onChange={v => update({previewProductId:v})}/></Panel>}"
          # Avoid complex product list injection here; use a plain field for preview slug instead.
          insert="{section.type === 'main_product' && <Panel title=\"Main product\"><Field label=\"Preview product ID\" value={s.previewProductId || ''} onChange={v => update({previewProductId:v})}/><div className=\"pteMini\">The live product page uses the current product automatically. The preview uses the first active product when this is empty.</div></Panel>}\n    {section.type === 'main_collection' && <Panel title=\"Main collection\"><Select label=\"Preview collection\" value={s.previewCollection || ''} options={[{value:'',label:'First active collection'}, ...collections.map(c => ({value:c.slug,label:c.name}))]} onChange={v => update({ previewCollection: v })}/><TextArea label=\"Heading override\" value={s.heading || ''} onChange={v => update({ heading: v })}/><TextArea label=\"Subheading\" value={s.subheading || ''} onChange={v => update({ subheading: v })}/></Panel>}\n    {section.type === 'image_with_text' && <Panel title=\"Content\">"
          s=s.replace(marker,insert,1)
          # Preview: filter products by collection and collections by source ids/slug.
          s=s.replace("if (section.type.includes('product')) { const items = products.slice(0, Number(s.limit || 8));", "if (section.type === 'main_product') { const p = s.previewProductId ? products.find(x => x.id === s.previewProductId) || products[0] : products[0]; return wrap(<section className=\"pteSectionBlock\"><div className=\"pteHead\"><div><small className=\"pteKicker\">PRODUCT</small><h2>{p?.name || 'Product preview'}</h2><p className=\"pteMuted\">{p?.slug || 'Choose a product in the live storefront'}</p></div></div>{p ? <div className=\"pteGrid\" style={{gridTemplateColumns:'1fr 1fr'}}><div className=\"pteThumb\">{p.images?.[0]?.url && <img src={p.images[0].url} alt=\"\"/>}</div><div><h2>{p.name}</h2><p className=\"pteMuted\">Product description, price and purchase controls appear on the live product page.</p><span className=\"pteCta\">Buy now</span></div></div> : <p className=\"pteMuted\">No active product found.</p>}</section>)}\n  if (section.type.includes('product')) { const filteredProducts = s.collection ? products.filter(p => (p.collections||[]).some(cp => cp.collection?.slug===s.collection || cp.collection?.id===s.collection)) : products; const items = filteredProducts.slice(0, Number(s.limit || 8));",1)
          s=s.replace("if (section.type.includes('collection')) { const items = collections.slice(0, Number(s.limit || 4));", "if (section.type === 'main_collection') { const c = (s.previewCollection ? collections.find(x => x.slug===s.previewCollection) : collections[0]); return wrap(<section className=\"pteSectionBlock\"><div className=\"pteHead\"><div><small className=\"pteKicker\">COLLECTION</small><h2>{s.heading || c?.name || 'Collection'}</h2><p className=\"pteMuted\">{s.subheading || c?.description || ''}</p></div></div><div className=\"pteGrid\" style={grid(4)}>{products.filter(p => !s.previewCollection || (p.collections||[]).some(cp => cp.collection?.slug===s.previewCollection || cp.collection?.id===s.previewCollection)).slice(0,24).map(p=><article className=\"pteProductCard\" key={p.id}><div className=\"pteThumb\">{p.images?.[0]?.url&&<img src={p.images[0].url} alt=\"\"/>}</div><strong>{p.name}</strong></article>)}</div></section>)}\n  if (section.type.includes('collection')) { const filteredCollections = s.sourceCollection ? collections.filter(c => c.slug===s.sourceCollection || c.id===s.sourceCollection) : collections; const items = filteredCollections.slice(0, Number(s.limit || 4));",1)
          # Pass collections into inspector.
          s=s.replace("<Inspector section={selected} tab={drawerTab} update={updateSection} addBlock={addBlock} patchBlock={patchBlock} removeBlock={removeBlock} chooseAsset={chooseAsset}/>", "<Inspector section={selected} tab={drawerTab} update={updateSection} addBlock={addBlock} patchBlock={patchBlock} removeBlock={removeBlock} chooseAsset={chooseAsset} collections={collections}/>",1)
          # Fix drag/drop to use dragged index, not selectedIndex.
          s=s.replace("if(Number.isFinite(from)&&from!==i)move(i)", "if(Number.isFinite(from)&&from!==i) commit(s=>({...s,templates:{...s.templates,[page]:(s.templates[page]||[]).map((x:any,idx:number)=>idx===from?{...x}:x)}})); if(Number.isFinite(from)&&from!==i){ updateCurrent(list=>{const next=[...list];const [item]=next.splice(from,1);next.splice(i,0,item);return next}) }")
          p.write_text(s)

          # Save all template drafts; keep Home in theme.sections and other templates in theme.editorTemplates.
          p=Path('app/api/admin/theme/route.ts'); s=p.read_text()
          s=s.replace("return json({theme,sections,navigation})", "const savedTheme=JSON.parse(JSON.stringify(theme)); savedTheme.editorTemplates=savedTheme.editorTemplates||{}; savedTheme.editorTemplates['Home page']=sections; return json({theme:savedTheme,sections,navigation})")
          p.write_text(s)

          # Product page: render the Product template from saved editorTemplates around the existing product data.
          p=Path('app/product/[slug]/page.tsx'); s=p.read_text()
          if "editorTemplates?.Product" not in s:
              old="if(!p||p.status!=='ACTIVE')return notFound();const variants="
              new="if(!p||p.status!=='ACTIVE')return notFound();const template=Array.isArray((theme as any).editorTemplates?.Product)?(theme as any).editorTemplates.Product:[];const variants="
              s=s.replace(old,new,1)
              # Add a template-controlled wrapper above the existing product content by preserving current details inside the product template's main-product area.
              s=s.replace("return <><main className=\"section productPage\">", "return <><main className=\"section productPage\"><div className=\"templateSections\">{template.filter((sec:any)=>sec.enabled!==false&&sec.type!=='header'&&sec.type!=='footer').map((sec:any)=>sec.type==='announcement'?<div key={sec.id} className=\"announcementSection\"><div className=\"announcementBar\"><div className=\"announcementInner container\">{sec.settings?.text||'Free shipping on orders over $50'}</div></div></div>:sec.type==='rich_text'?<section key={sec.id} className=\"section\"><div className=\"container\"><span className=\"muted\">{sec.settings?.eyebrow||'ABOUT THE STORE'}</span><h2 className=\"h2\">{sec.settings?.heading||''}</h2><p className=\"body muted\">{sec.settings?.text||''}</p></div></section>:sec.type==='newsletter'?<section key={sec.id} className=\"section\"><div className=\"container\"><div className=\"newsletterHome primary\"><h2 className=\"h2\">{sec.settings?.heading||'Stay in the loop'}</h2><p className=\"muted\">{sec.settings?.text||''}</p></div></div></section>:sec.type==='product_recommendations'?null:null)}</div>")
              p.write_text(s)

          # Collection page: let Collection template settings control collection banner/grid ordering.
          p=Path('app/collections/[slug]/page.tsx'); s=p.read_text()
          if "editorTemplates?.Collection" not in s:
              s=s.replace("if(!c||!c.isActive)notFound();return <>", "if(!c||!c.isActive)notFound();const template=Array.isArray((theme as any).editorTemplates?.Collection)?(theme as any).editorTemplates.Collection:[];return <>",1)
              s=s.replace("<main className=\"section\"><div className=\"container\">", "<main className=\"section\"><div className=\"templateSections\">{template.filter((sec:any)=>sec.enabled!==false&&sec.type!=='header'&&sec.type!=='footer').map((sec:any)=>sec.type==='announcement'?<div key={sec.id} className=\"announcementSection\"><div className=\"announcementBar\"><div className=\"announcementInner container\">{sec.settings?.text||'Free shipping on orders over $50'}</div></div></div>:sec.type==='main_collection'||sec.type==='main_collection_banner'?<section key={sec.id} className=\"section\"><div className=\"container\"><div className=\"collectionHero\"><span className=\"muted\">COLLECTION</span><h1 className=\"h2\">{sec.settings?.heading||c.name}</h1><p className=\"body muted\">{sec.settings?.subheading||c.description||''}</p></div></div></section>:sec.type==='newsletter'?<section key={sec.id} className=\"section\"><div className=\"container\"><div className=\"newsletterHome primary\"><h2 className=\"h2\">{sec.settings?.heading||'Stay in the loop'}</h2><p className=\"muted\">{sec.settings?.text||''}</p></div></div></section>:null)}</div><div className=\"container\">")
              p.write_text(s)

          # Home: collection-selected product grids now use relation data.
          p=Path('app/page.tsx'); s=p.read_text()
          s=s.replace("include:{images:true,category:true}", "include:{images:true,category:true,collections:{include:{collection:true}}}")
          s=s.replace("const products=products.slice(0,Number(s.limit||8))", "const productsForSection=s.collection?products.filter((p:any)=>(p.collections||[]).some((cp:any)=>cp.collection?.slug===s.collection||cp.collection?.id===s.collection)):products;const products=productsForSection.slice(0,Number(s.limit||8))")
          p.write_text(s)

          # Ensure no broken placeholder identifier was introduced.
          bad=Path('components/pro-theme-editor.tsx').read_text()
          if 'productsForInspectorPlaceholder' in bad:
              raise SystemExit('unexpected placeholder')

          # Remove this temporary workflow after applying the repair.
          Path('.github/workflows/repair-theme-editor.yml').unlink()
          PY
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "Fix Shopify-style collection and product templates"
          git push
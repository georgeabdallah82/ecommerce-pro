name: Repair theme pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic Shopify-style theme fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          BASE='5b9686f87e25dcfde518974ee5a8bd0d1eb82f7f'
          def base_file(path):
              return subprocess.check_output(['git','show',f'{BASE}:{path}']).decode()
          def restore(path):
              Path(path).write_text(base_file(path))

          # Start from the last known-good buildable theme implementation.
          for path in ['app/page.tsx','components/pro-theme-editor.tsx','app/product/[slug]/page.tsx','app/collections/[slug]/page.tsx','app/api/products/route.ts']:
              restore(path)

          # Home storefront: filter featured product grids by selected collection
          # and collection lists by explicitly selected collections.
          p=Path('app/page.tsx'); s=p.read_text()
          s=s.replace("products.slice(0,Number(s.limit||8)).map(p=><ProductCard", "(s.collection?products.filter((p:any)=>(p.collections||[]).some((cp:any)=>cp.collection?.slug===s.collection||cp.collection?.id===s.collection)):products).slice(0,Number(s.limit||8)).map(p=><ProductCard", 1)
          s=s.replace("collections.slice(0,Number(s.limit||4)).map(c=><Link", "(s.collectionIds?.length?collections.filter((c:any)=>s.collectionIds.includes(c.id)||s.collectionIds.includes(c.slug)):s.sourceCollection?collections.filter((c:any)=>c.id===s.sourceCollection||c.slug===s.sourceCollection):collections).slice(0,Number(s.limit||4)).map(c=><Link", 1)
          p.write_text(s)

          # Theme editor: collection multi-select + real product preview selector.
          p=Path('components/pro-theme-editor.tsx'); s=p.read_text()
          s=s.replace("function Inspector({ section, tab, update, addBlock, patchBlock, removeBlock, chooseAsset, collections }: { section: Section; tab: DrawerTab; update: (p: AnyMap) => void; addBlock: (type: string) => void; patchBlock: (id: string, p: AnyMap) => void; removeBlock: (id: string) => void; chooseAsset: (target: MediaTarget) => void; collections: CatalogCollection[] }) {", "function Inspector({ section, tab, update, addBlock, patchBlock, removeBlock, chooseAsset, collections, products }: { section: Section; tab: DrawerTab; update: (p: AnyMap) => void; addBlock: (type: string) => void; patchBlock: (id: string, p: AnyMap) => void; removeBlock: (id: string) => void; chooseAsset: (target: MediaTarget) => void; collections: CatalogCollection[]; products: CatalogProduct[] }) {", 1)
          s=s.replace("<div className=\"pteMini\">For a Collection List, choose a source to show that collection first. For the Collection template, choose the current collection from the template preview.</div></Panel>}", "<div className=\"pteField\"><span>Selected collections</span><div style={{display:'grid',gap:6}}>{collections.map(c=>{const ids=Array.isArray(s.collectionIds)?s.collectionIds:[];const checked=ids.includes(c.id)||ids.includes(c.slug);return <button type=\"button\" key={c.id} onClick={()=>update({collectionIds:checked?ids.filter((x:any)=>x!==c.id&&x!==c.slug):[...ids,c.id]})} style={{border:'1px solid #dfe3e6',background:checked?'var(--accent-soft)':'#fff',borderRadius:7,padding:'8px 9px',textAlign:'left',fontSize:10,cursor:'pointer'}}>{checked?'✓ ':''}{c.name}</button>})}</div></div><div className=\"pteMini\">Select one or more real collections. An empty selection shows all active collections.</div></Panel>}", 1)
          s=s.replace("{section.type === 'main_product' && <Panel title=\"Main product\"><Field label=\"Preview product ID\" value={s.previewProductId || ''} onChange={v => update({previewProductId:v})}/><div className=\"pteMini\">The live product page uses the current product automatically. The preview uses the first active product when this is empty.</div></Panel>}", "{section.type === 'main_product' && <Panel title=\"Main product\"><Select label=\"Preview product\" value={s.previewProductId || ''} options={[{value:'',label:'First active product'}, ...products.map(p=>({value:p.id,label:p.name}))]} onChange={v => update({previewProductId:v})}/><div className=\"pteMini\">This selector changes the editor preview only; the storefront automatically uses the product being viewed.</div></Panel>}", 1)
          s=s.replace("<Inspector section={selected} tab={drawerTab} update={updateSection} addBlock={addBlock} patchBlock={patchBlock} removeBlock={removeBlock} chooseAsset={chooseAsset} collections={collections}/>", "<Inspector section={selected} tab={drawerTab} update={updateSection} addBlock={addBlock} patchBlock={patchBlock} removeBlock={removeBlock} chooseAsset={chooseAsset} collections={collections} products={products}/>", 1)
          p.write_text(s)

          # Product template: section order on the storefront follows the saved Theme Editor template.
          product_page='''import {db} from '@/lib/prisma'
import {getThemeState} from '@/lib/theme'
import {notFound} from 'next/navigation'
import {Footer} from '@/components/footer'
import {ProductPurchase} from '@/components/product-purchase'
import {ReviewForm} from '@/components/review-form'
import ProductGallery from '@/components/product-gallery'
import {ProductCard} from '@/components/product-card'
import Link from 'next/link'
import {Share2,Heart} from 'lucide-react'

export default async function ProductPage({params}:{params:Promise<{slug:string}>}){
  const {slug}=await params
  const {theme}=await getThemeState()
  const p=await db.product.findUnique({where:{slug},include:{images:{orderBy:{sortOrder:'asc'}},category:true,variants:{include:{inventory:true}},reviews:{where:{approved:true},include:{user:{select:{name:true}}},orderBy:{createdAt:'desc'},take:12}}})
  if(!p||p.status!=='ACTIVE')return notFound()
  const template=Array.isArray((theme as any).editorTemplates?.Product)&&((theme as any).editorTemplates.Product as any[]).length?(theme as any).editorTemplates.Product as any[]:[{id:'announcement',type:'announcement',enabled:true,settings:{text:theme.announcement?.text||'Free shipping on orders over $50',background:'primary'}},{id:'header',type:'header',enabled:true,settings:{}},{id:'main_product',type:'main_product',enabled:true,settings:{}},{id:'product_recommendations',type:'product_recommendations',enabled:true,settings:{heading:'You may also like',limit:Number(theme.productPage?.relatedLimit||4),columns:4}},{id:'newsletter',type:'newsletter',enabled:true,settings:{}},{id:'footer',type:'footer',enabled:true,settings:{}}]
  const variants=p.variants.map(v=>({id:v.id,name:v.name,sku:v.sku,price:v.price,compareAtPrice:v.compareAtPrice,stock:v.inventory.reduce((a,x)=>a+Math.max(0,x.quantity-x.reserved),0)}))
  const related=p.category?await db.product.findMany({where:{status:'ACTIVE',categoryId:p.categoryId,id:{not:p.id}},include:{images:true,category:true},take:12,orderBy:{featured:'desc'}}):[]
  const mainProduct=<section className="section productPage"><div className="container">{theme.productPage?.showBreadcrumbs!==false&&<div className="breadcrumbs"><Link href="/shop">Shop</Link><span>/</span>{p.category&&<><Link href={`/shop?category=${p.category.slug}`}>{p.category.name}</Link><span>/</span></>}<span>{p.name}</span></div>}<div className={`productLayout gallery-${theme.productPage?.gallery||'left'}`}><ProductGallery images={p.images} name={p.name}/><div className={`productInfo ${theme.productPage?.stickyInfo?'stickyInfo':''}`}>{theme.productPage?.showVendor!==false&&<div className="muted uppercase">{p.vendor||p.category?.name||'PRODUCT'}</div>}<h1>{p.name}</h1>{theme.productPage?.showReviews!==false&&<div className="productRating">{'★'.repeat(Math.round(p.reviews.length?p.reviews.reduce((s,r)=>s+r.rating,0)/p.reviews.length:0))}{p.reviews.length>0&&<span>{p.reviews.length} reviews</span>}</div>}<p className="productLead">{p.shortDescription||p.description||''}</p><ProductPurchase productId={p.id} name={p.name} sku={p.sku} basePrice={p.basePrice} compareAtPrice={p.compareAtPrice} image={p.images[0]?.url} variants={variants}/><div className="productActionRow">{theme.productPage?.showWishlist!==false&&<button className="btn secondary"><Heart size={16}/> Wishlist</button>}{theme.productPage?.showShare!==false&&<button className="btn secondary"><Share2 size={16}/> Share</button>}</div><div className="productDetailsAcc">{theme.productPage?.showDescription!==false&&<details open><summary>Description</summary><div className="richProductText">{p.description||p.shortDescription||'No description yet.'}</div></details>}{theme.productPage?.showShippingAccordion!==false&&<details><summary>Shipping & returns</summary><div className="richProductText">Shipping rates and delivery estimates are calculated at checkout. Returns follow your store policy.</div></details>}{theme.productPage?.showSpecs!==false&&<details><summary>Product information</summary><div className="productSpecGrid"><span>SKU</span><strong>{p.sku}</strong><span>Category</span><strong>{p.category?.name||'—'}</strong>{p.weight&&<><span>Weight</span><strong>{p.weight} {p.weightUnit||'kg'}</strong></>}</div></details>}</div></div></div>{theme.productPage?.showReviews!==false&&<section className="productReviews"><div className="sectionHead"><div><span className="muted">CUSTOMER REVIEWS</span><h2 className="h2">What customers think</h2></div></div>{!p.reviews.length?<p className="muted">No reviews yet.</p>:<div className="reviewGrid">{p.reviews.map(r=><article className="reviewCard" key={r.id}><div className="reviewStars">{'★'.repeat(r.rating)}{'☆'.repeat(5-r.rating)}</div><strong>{r.title||'Verified review'}</strong><p>{r.body}</p><span className="muted">{r.user.name}</span></article>)}</div>}<ReviewForm productId={p.id}/></section>}</div></div></section>
  const recommendations=(sec:any)=><section className="section relatedProducts"><div className="container"><div className="sectionHead"><div><span className="muted">YOU MAY ALSO LIKE</span><h2 className="h2">{sec.settings?.heading||'Related products'}</h2></div><Link href={p.category?`/shop?category=${p.category.slug}`:'/shop'} className="btn secondary">View all</Link></div><div className="grid productGrid">{related.slice(0,Number(sec.settings?.limit||4)).map(r=><ProductCard key={r.id} p={r}/>)}</div></div></section>
  const rich=(sec:any)=><section className="section"><div className="container"><span className="muted">{sec.settings?.eyebrow||'ABOUT THE STORE'}</span><h2 className="h2">{sec.settings?.heading||''}</h2><p className="body muted">{sec.settings?.text||''}</p></div></section>
  const newsletter=(sec:any)=><section className="section"><div className="container"><div className={`newsletterHome ${sec.settings?.background||'primary'}`}><div><span className="muted">NEWSLETTER</span><h2 className="h2">{sec.settings?.heading||'Stay in the loop'}</h2><p className="muted">{sec.settings?.text||''}</p></div></div></div></section>
  return <><main>{template.filter((sec:any)=>sec.enabled!==false&&sec.type!=='header').map((sec:any)=>sec.type==='announcement'?<section key={sec.id} className="storeSection announcementSection" style={{padding:0,background:sec.settings?.background==='secondary'?theme.colors.secondary:theme.colors.primary,color:sec.settings?.textColor||'#fff'}}><div className="announcementBar"><div className="announcementInner container">{sec.settings?.text||'Free shipping on orders over $50'}</div></div></section>:sec.type==='main_product'||sec.type==='featured_product'?<div key={sec.id}>{mainProduct}</div>:sec.type==='product_recommendations'?<div key={sec.id}>{recommendations(sec)}</div>:sec.type==='rich_text'?<div key={sec.id}>{rich(sec)}</div>:sec.type==='newsletter'?<div key={sec.id}>{newsletter(sec)}</div>:sec.type==='footer'?<Footer key={sec.id}/>:null)}</main></>
}
'''
          Path('app/product/[slug]/page.tsx').write_text(product_page)

          # Collection template: section order/settings on the storefront follow the saved Theme Editor template.
          collection_page='''import {db} from '@/lib/prisma'
import {getThemeState} from '@/lib/theme'
import {notFound} from 'next/navigation'
import {ProductCard} from '@/components/product-card'
import {Footer} from '@/components/footer'

export default async function CollectionPage({params}:{params:Promise<{slug:string}>}){
  const {slug}=await params
  const {theme}=await getThemeState()
  const c=await db.collection.findUnique({where:{slug},include:{products:{include:{product:{include:{images:true,category:true}}},orderBy:{sortOrder:'asc'}}}})
  if(!c||!c.isActive)notFound()
  const template=Array.isArray((theme as any).editorTemplates?.Collection)&&((theme as any).editorTemplates.Collection as any[]).length?(theme as any).editorTemplates.Collection as any[]:[{id:'announcement',type:'announcement',enabled:true,settings:{text:theme.announcement?.text||'Free shipping on orders over $50',background:'primary'}},{id:'header',type:'header',enabled:true,settings:{}},{id:'main_collection',type:'main_collection',enabled:true,settings:{}},{id:'main_collection_grid',type:'main_collection_grid',enabled:true,settings:{}},{id:'newsletter',type:'newsletter',enabled:true,settings:{}},{id:'footer',type:'footer',enabled:true,settings:{}}]
  const products=c.products.map(x=>x.product)
  const banner=(sec:any)=><section className="section"><div className="container"><div className="collectionHero"><span className="muted">COLLECTION</span><h1 className="h2">{sec.settings?.heading||c.name}</h1><p className="body muted">{sec.settings?.subheading||c.description||''}</p></div></div></section>
  const productGrid=(sec:any)=><section className="section"><div className="container"><div className="sectionHead"><div><span className="muted">{c.name}</span><h2 className="h2">{sec.settings?.heading||'Products'}</h2></div></div><div className="grid productGrid" style={{gridTemplateColumns:`repeat(${Math.min(Number(sec.settings?.columns||4),6)},minmax(0,1fr))`}}>{products.slice(0,Number(sec.settings?.limit||24)).map(p=><ProductCard p={p} key={p.id}/>)}</div></div></section>
  const rich=(sec:any)=><section className="section"><div className="container"><span className="muted">{sec.settings?.eyebrow||'COLLECTION'}</span><h2 className="h2">{sec.settings?.heading||''}</h2><p className="body muted">{sec.settings?.text||''}</p></div></section>
  const newsletter=(sec:any)=><section className="section"><div className="container"><div className={`newsletterHome ${sec.settings?.background||'primary'}`}><h2 className="h2">{sec.settings?.heading||'Stay in the loop'}</h2><p className="muted">{sec.settings?.text||''}</p></div></div></section>
  return <><main>{template.filter((sec:any)=>sec.enabled!==false&&sec.type!=='header').map((sec:any)=>sec.type==='announcement'?<section key={sec.id} className="storeSection announcementSection" style={{padding:0,background:sec.settings?.background==='secondary'?theme.colors.secondary:theme.colors.primary,color:sec.settings?.textColor||'#fff'}}><div className="announcementBar"><div className="announcementInner container">{sec.settings?.text||'Free shipping on orders over $50'}</div></div></section>:sec.type==='main_collection'||sec.type==='main_collection_banner'?<div key={sec.id}>{banner(sec)}</div>:sec.type==='main_collection_grid'||sec.type==='collection_grid'||sec.type==='collection_carousel'?<div key={sec.id}>{productGrid(sec)}</div>:sec.type==='rich_text'?<div key={sec.id}>{rich(sec)}</div>:sec.type==='newsletter'?<div key={sec.id}>{newsletter(sec)}</div>:sec.type==='footer'?<Footer key={sec.id}/>:null)}</main></>
}
'''
          Path('app/collections/[slug]/page.tsx').write_text(collection_page)

          Path('.github/workflows/repair-theme-pages.yml').unlink()
          PY
      - name: Typecheck changes before commit
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "Fix Shopify-style collection and product templates"
          git push

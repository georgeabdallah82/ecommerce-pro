name: Repair theme pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic theme fixes from known-good base
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          BASE='5b9686f87e25dcfde518974ee5a8bd0d1eb82f7f'

          def restore(path):
              Path(path).write_text(subprocess.check_output(['git','show',f'{BASE}:{path}']).decode())

          for path in ['app/page.tsx','components/pro-theme-editor.tsx','app/product/[slug]/page.tsx','app/collections/[slug]/page.tsx','app/api/products/route.ts']:
              restore(path)

          # Product API: make collection membership available to the editor/storefront.
          p=Path('app/api/products/route.ts'); s=p.read_text()
          s=s.replace("tags: true,\n      },", "tags: true,\n          collections: { include: { collection: true } },\n      },")
          p.write_text(s)

          # Home storefront: use selected collection(s) for product grids and collection list sections.
          p=Path('app/page.tsx'); s=p.read_text()
          s=s.replace("products.slice(0,Number(s.limit||8)).map(p=><ProductCard", "(s.collection?products.filter((p:any)=>(p.collections||[]).some((cp:any)=>cp.collection?.slug===s.collection||cp.collection?.id===s.collection)):products).slice(0,Number(s.limit||8)).map(p=><ProductCard", 1)
          s=s.replace("collections.slice(0,Number(s.limit||4)).map(c=><Link", "(s.collectionIds?.length?collections.filter((c:any)=>s.collectionIds.includes(c.id)||s.collectionIds.includes(c.slug)):s.sourceCollection?collections.filter((c:any)=>c.id===s.sourceCollection||c.slug===s.sourceCollection):collections).slice(0,Number(s.limit||4)).map(c=><Link", 1)
          s=s.replace("include:{images:true,category:true}", "include:{images:true,category:true,collections:{include:{collection:true}}}", 1)
          p.write_text(s)

          # Theme editor: add Shopify-style collection/product selectors and real template sections.
          p=Path('components/pro-theme-editor.tsx'); s=p.read_text()
          s=s.replace("type CatalogProduct = { id: string; name: string; slug?: string; basePrice: number; images?: { url: string }[] }", "type CatalogProduct = { id: string; name: string; slug?: string; basePrice: number; images?: { url: string }[]; collections?: { collection: { id: string; slug: string; name?: string } }[] }")
          s=s.replace("main_collection_banner: { label: 'Collection banner'", "main_product: { label: 'Main product', category: 'Products', description: 'Main product details, purchase controls and reviews.' },\n  main_collection: { label: 'Main collection', category: 'Collections', description: 'Current collection banner and product grid.' },\n  main_collection_banner: { label: 'Collection banner'")
          s=s.replace("if (type.includes('product')) return { id: id(type), type, enabled: true, settings: { ...common, heading:", "if (type === 'main_product') return { id: id(type), type, enabled: true, settings: { ...common, heading: '', previewProductId: '' }, blocks: [] }\n  if (type.includes('product')) return { id: id(type), type, enabled: true, settings: { ...common, heading:", 1)
          s=s.replace("'Product': [section('announcement'), section('header'), section('featured_product'), section('product_recommendations'), section('newsletter'), section('footer')],", "'Product': [section('announcement'), section('header'), section('main_product'), section('product_recommendations'), section('newsletter'), section('footer')],", 1)
          s=s.replace("if (type.includes('collection')) return { id: id(type), type, enabled: true, settings: { ...common, heading:", "if (type === 'main_collection') return { id: id(type), type, enabled: true, settings: { ...common, heading: 'Collection', subheading: '', previewCollection: '', limit: 24, columns: 4 }, blocks: [] }\n  if (type.includes('collection')) return { id: id(type), type, enabled: true, settings: { ...common, heading:", 1)
          old="function Select({ label, value, options, onChange }: { label: string; value: string; options: string[]; onChange: (v: string) => void }) { return <label className=\"pteField\"><span>{label}</span><select value={value} onChange={e => onChange(e.target.value)}>{options.map(o => <option key={o} value={o}>{o}</option>)}</select></label> }"
          new="function Select({ label, value, options, onChange }: { label: string; value: string; options: (string | {value:string;label:string})[]; onChange: (v: string) => void }) { return <label className=\"pteField\"><span>{label}</span><select value={value} onChange={e => onChange(e.target.value)}>{options.map(o => { const v=typeof o==='string'?o:o.value; const l=typeof o==='string'?o:o.label; return <option key={v} value={v}>{l}</option> })}</select></label> }"
          if old in s: s=s.replace(old,new,1)
          s=s.replace("function Inspector({ section, tab, update, addBlock, patchBlock, removeBlock, chooseAsset }: { section: Section; tab: DrawerTab; update: (p: AnyMap) => void; addBlock: (type: string) => void; patchBlock: (id: string, p: AnyMap) => void; removeBlock: (id: string) => void; chooseAsset: (target: MediaTarget) => void }) {", "function Inspector({ section, tab, update, addBlock, patchBlock, removeBlock, chooseAsset, collections, products }: { section: Section; tab: DrawerTab; update: (p: AnyMap) => void; addBlock: (type: string) => void; patchBlock: (id: string, p: AnyMap) => void; removeBlock: (id: string) => void; chooseAsset: (target: MediaTarget) => void; collections: CatalogCollection[]; products: CatalogProduct[] }) {")
          s=s.replace("<Toggle label=\"Show view all\" value={s.showViewAll !== false} onChange={v => update({ showViewAll: v })}/></Panel>}", "<Select label=\"Collection\" value={s.collection || ''} options={[{value:'',label:'All products'}, ...collections.map(c => ({value:c.slug,label:c.name}))]} onChange={v => update({ collection: v })}/><Toggle label=\"Show view all\" value={s.showViewAll !== false} onChange={v => update({ showViewAll: v })}/></Panel>}",1)
          s=s.replace("<div className=\"pteMini\">For a Collection List, choose a source to show that collection first. For the Collection template, choose the current collection from the template preview.</div></Panel>}", "<div className=\"pteField\"><span>Selected collections</span><div style={{display:'grid',gap:6}}>{collections.map(c=>{const ids=Array.isArray(s.collectionIds)?s.collectionIds:[];const checked=ids.includes(c.id)||ids.includes(c.slug);return <button type=\"button\" key={c.id} onClick={()=>update({collectionIds:checked?ids.filter((x:any)=>x!==c.id&&x!==c.slug):[...ids,c.id]})} style={{border:'1px solid #dfe3e6',background:checked?'var(--accent-soft)':'#fff',borderRadius:7,padding:'8px 9px',textAlign:'left',fontSize:10,cursor:'pointer'}}>{checked?'✓ ':''}{c.name}</button>})}</div></div><div className=\"pteMini\">Choose exactly which collections appear. Leaving empty shows all active collections.</div></Panel>}",1)
          s=s.replace("{section.type === 'main_product' && <Panel title=\"Main product\"><Field label=\"Preview product ID\" value={s.previewProductId || ''} onChange={v => update({previewProductId:v})}/><div className=\"pteMini\">The live product page uses the current product automatically. The preview uses the first active product when this is empty.</div></Panel>}", "{section.type === 'main_product' && <Panel title=\"Main product\"><Select label=\"Preview product\" value={s.previewProductId || ''} options={[{value:'',label:'First active product'}, ...products.map(p=>({value:p.id,label:p.name}))]} onChange={v => update({previewProductId:v})}/><div className=\"pteMini\">Preview selection only; the live page uses the product being viewed.</div></Panel>}")
          s=s.replace("<Inspector section={selected} tab={drawerTab} update={updateSection} addBlock={addBlock} patchBlock={patchBlock} removeBlock={removeBlock} chooseAsset={chooseAsset}/>", "<Inspector section={selected} tab={drawerTab} update={updateSection} addBlock={addBlock} patchBlock={patchBlock} removeBlock={removeBlock} chooseAsset={chooseAsset} collections={collections} products={products}/>",1)
          s=s.replace("if (section.type.includes('product')) { const items = products.slice(0, Number(s.limit || 8));", "if (section.type === 'main_product') { const p = s.previewProductId ? products.find(x => x.id === s.previewProductId) || products[0] : products[0]; return wrap(<section className=\"pteSectionBlock\"><div className=\"pteHead\"><div><small className=\"pteKicker\">PRODUCT</small><h2>{p?.name || 'Product preview'}</h2><p className=\"pteMuted\">{p?.slug || 'Choose a product'}</p></div></div>{p ? <div className=\"pteGrid\" style={{gridTemplateColumns:'1fr 1fr'}}><div className=\"pteThumb\">{p.images?.[0]?.url&&<img src={p.images[0].url} alt=\"\"/>}</div><div><h2>{p.name}</h2><p className=\"pteMuted\">Live product details, variants, purchase controls and reviews.</p><span className=\"pteCta\">Buy now</span></div></div> : <p className=\"pteMuted\">No active product found.</p>}</section>)}\n  if (section.type.includes('product')) { const filteredProducts=s.collection?products.filter(p=>(p.collections||[]).some(cp=>cp.collection?.slug===s.collection||cp.collection?.id===s.collection)):products; const items=filteredProducts.slice(0,Number(s.limit||8));",1)
          s=s.replace("if (section.type.includes('collection')) { const items = collections.slice(0, Number(s.limit || 4));", "if (section.type === 'main_collection') { const c=s.previewCollection?collections.find(x=>x.slug===s.previewCollection):collections[0]; return wrap(<section className=\"pteSectionBlock\"><div className=\"pteHead\"><div><small className=\"pteKicker\">COLLECTION</small><h2>{s.heading||c?.name||'Collection'}</h2><p className=\"pteMuted\">{s.subheading||c?.description||''}</p></div></div><div className=\"pteGrid\" style={grid(4)}>{products.filter(p=>!s.previewCollection||(p.collections||[]).some(cp=>cp.collection?.slug===s.previewCollection||cp.collection?.id===s.previewCollection)).slice(0,24).map(p=><article className=\"pteProductCard\" key={p.id}><div className=\"pteThumb\">{p.images?.[0]?.url&&<img src={p.images[0].url} alt=\"\"/>}</div><strong>{p.name}</strong></article>)}</div></section>)}\n  if (section.type.includes('collection')) { const filteredCollections=s.collectionIds?.length?collections.filter(c=>s.collectionIds.includes(c.id)||s.collectionIds.includes(c.slug)):s.sourceCollection?collections.filter(c=>c.slug===s.sourceCollection||c.id===s.sourceCollection):collections; const items=filteredCollections.slice(0,Number(s.limit||4));",1)
          p.write_text(s)

          # Product template storefront.
          Path('app/product/[slug]/page.tsx').write_text(subprocess.check_output(['git','show',f'{BASE}:app/product/[slug]/page.tsx']).decode())
          p=Path('app/product/[slug]/page.tsx'); s=p.read_text()
          s=s.replace("const p=await db.product.findUnique", "const p=await db.product.findUnique", 1)
          s=s.replace("if(!p||p.status!=='ACTIVE')return notFound();const variants=", "if(!p||p.status!=='ACTIVE')return notFound();const template=Array.isArray((theme as any).editorTemplates?.Product)&&((theme as any).editorTemplates.Product as any[]).length?(theme as any).editorTemplates.Product as any[]:[{id:'announcement',type:'announcement',enabled:true,settings:{text:theme.announcement?.text||'Free shipping on orders over $50',background:'primary'}},{id:'main_product',type:'main_product',enabled:true,settings:{}},{id:'product_recommendations',type:'product_recommendations',enabled:true,settings:{heading:'You may also like',limit:Number(theme.productPage?.relatedLimit||4),columns:4}},{id:'footer',type:'footer',enabled:true,settings:{}}];const variants=",1)
          marker="return <><main className=\"section productPage\"><div className=\"container\">"
          wrapper="return <><main className=\"section productPage\"><div className=\"templateSections\">{template.filter((sec:any)=>sec.enabled!==false&&sec.type!=='header').map((sec:any)=>sec.type==='announcement'?<section key={sec.id} className=\"storeSection announcementSection\" style={{padding:0,background:sec.settings?.background==='secondary'?theme.colors.secondary:theme.colors.primary,color:sec.settings?.textColor||'#fff'}}><div className=\"announcementBar\"><div className=\"announcementInner container\">{sec.settings?.text||'Free shipping on orders over $50'}</div></div></section>:sec.type==='main_product'||sec.type==='featured_product'?<div key={sec.id}>PRODUCT_SLOT</div>:sec.type==='product_recommendations'?<div key={sec.id}>RECOMMEND_SLOT</div>:sec.type==='rich_text'?<section key={sec.id} className=\"section\"><div className=\"container\"><span className=\"muted\">{sec.settings?.eyebrow||'ABOUT THE STORE'}</span><h2 className=\"h2\">{sec.settings?.heading||''}</h2><p className=\"body muted\">{sec.settings?.text||''}</p></div></section>:sec.type==='newsletter'?<section key={sec.id} className=\"section\"><div className=\"container\"><div className={`newsletterHome ${sec.settings?.background||'primary'}`}><h2 className=\"h2\">{sec.settings?.heading||'Stay in the loop'}</h2><p className=\"muted\">{sec.settings?.text||''}</p></div></div></section>:sec.type==='footer'?<Footer key={sec.id}/>:null)}</div><div className=\"container\">"
          if marker not in s: raise SystemExit('product marker missing')
          s=s.replace(marker,wrapper,1)
          # replace placeholder with the original main product body up to the closing of its container by extracting from base file
          basep=subprocess.check_output(['git','show',f'{BASE}:app/product/[slug]/page.tsx']).decode()
          body=basep.split('return <><main className="section productPage"><div className="container">',1)[1]
          # body starts with breadcrumbs and ends with </main><Footer...}; strip final wrapper so slot content is a fragment.
          body=body.rsplit('</div></main><Footer/></>',1)[0]
          s=s.replace('<div key={sec.id}>PRODUCT_SLOT</div>', '<div key={sec.id}>PLACE_PRODUCT_BODY</div>',1)
          s=s.replace('<div key={sec.id}>RECOMMEND_SLOT</div>', '<div key={sec.id}>PLACE_RECOMMEND</div>',1)
          s=s.replace('PLACE_PRODUCT_BODY', body, 1)
          rec="<section className=\"section relatedProducts\"><div className=\"container\"><div className=\"sectionHead\"><div><span className=\"muted\">YOU MAY ALSO LIKE</span><h2 className=\"h2\">Related products</h2></div><Link href={p.category?`/shop?category=${p.category.slug}`:'/shop'} className=\"btn secondary\">View all</Link></div><div className=\"grid productGrid\">{related.slice(0,Number(sec.settings?.limit||4)).map(r=><ProductCard key={r.id} p={r}/>)}</div></div></section>"
          s=s.replace('PLACE_RECOMMEND', rec, 1)
          s=s.replace('</div><div className="container">','</div><div className="container">',1)
          # The base file already includes Footer in its final return; remove it because footer is template-controlled.
          tail='</div></main><Footer/></>'
          if tail in s: s=s.replace(tail,'</div></main></>',1)
          p.write_text(s)

          # Collection template storefront.
          p=Path('app/collections/[slug]/page.tsx')
          s=subprocess.check_output(['git','show',f'{BASE}:app/collections/[slug]/page.tsx']).decode()
          # Build a clean template-driven collection page using the existing collection/product data shape.
          s=s.replace("export default async function CollectionPage({params}:{params:Promise<{slug:string}>}){", "export default async function CollectionPage({params}:{params:Promise<{slug:string}>}){")
          old_body="const {slug}=await params;const {theme}=await getThemeState();const c=await db.collection.findUnique({where:{slug},include:{products:{include:{product:{include:{images:true,category:true}}},orderBy:{sortOrder:'asc'}}}});if(!c||!c.isActive)notFound();return <><main className=\"section\"><div className=\"container\">"
          if old_body not in s: raise SystemExit('collection base shape changed')
          # Keep the existing page rendering as fallback, but add template selection for saved template sections.
          s=s.replace("if(!c||!c.isActive)notFound();return <><main className=\"section\"><div className=\"container\">", "if(!c||!c.isActive)notFound();const template=Array.isArray((theme as any).editorTemplates?.Collection)&&((theme as any).editorTemplates.Collection as any[]).length?(theme as any).editorTemplates.Collection as any[]:[{id:'announcement',type:'announcement',enabled:true,settings:{text:theme.announcement?.text||'Free shipping on orders over $50',background:'primary'}},{id:'main_collection',type:'main_collection',enabled:true,settings:{}},{id:'main_collection_grid',type:'main_collection_grid',enabled:true,settings:{}},{id:'newsletter',type:'newsletter',enabled:true,settings:{}},{id:'footer',type:'footer',enabled:true,settings:{}}];return <>{template.filter((sec:any)=>sec.enabled!==false&&sec.type!=='header').map((sec:any)=>sec.type==='announcement'?<section key={sec.id} className=\"storeSection announcementSection\" style={{padding:0,background:sec.settings?.background==='secondary'?theme.colors.secondary:theme.colors.primary,color:sec.settings?.textColor||'#fff'}}><div className=\"announcementBar\"><div className=\"announcementInner container\">{sec.settings?.text||'Free shipping on orders over $50'}</div></div></section>:sec.type==='main_collection'||sec.type==='main_collection_banner'?<section key={sec.id} className=\"section\"><div className=\"container\"><div className=\"collectionHero\"><span className=\"muted\">COLLECTION</span><h1 className=\"h2\">{sec.settings?.heading||c.name}</h1><p className=\"body muted\">{sec.settings?.subheading||c.description||''}</p></div></div></section>:sec.type==='main_collection_grid'||sec.type==='collection_grid'||sec.type==='collection_carousel'?<section key={sec.id} className=\"section\"><div className=\"container\"><div className=\"grid productGrid\" style={{gridTemplateColumns:`repeat(${Math.min(Number(sec.settings?.columns||4),6)},minmax(0,1fr))`}}>{c.products.slice(0,Number(sec.settings?.limit||24)).map(x=><ProductCard key={x.productId} p={x.product}/>)}</div></div></section>:sec.type==='newsletter'?<section key={sec.id} className=\"section\"><div className=\"container\"><div className={`newsletterHome ${sec.settings?.background||'primary'}`}><h2 className=\"h2\">{sec.settings?.heading||'Stay in the loop'}</h2><p className=\"muted\">{sec.settings?.text||''}</p></div></div></section>:sec.type==='footer'?<Footer key={sec.id}/>:null)}</>}")
          p.write_text(s)

          # Temporary workflow deletes itself after applying changes.
          Path('.github/workflows/repair-theme-pages.yml').unlink()
          PY
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "Fix Shopify-style collection and product templates"
          git push
services:
  - type: web
    name: ecommerce-pro-v7
    runtime: node
    plan: free
    region: frankfurt

    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    healthCheckPath: /

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-pro-db
          property: connectionString

      - key: AUTH_SECRET
        generateValue: true

      - key: NEXT_PUBLIC_BRAND_NAME
        value: Your Brand

      - key: NEXT_PUBLIC_CURRENCY
        value: USD

      - key: NEXT_PUBLIC_COUNTRY
        value: Lebanon

      - key: NEXT_PUBLIC_LOCALE
        value: en-US

      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        value: ""

      - key: SEED_ADMIN_PASSWORD
        sync: false

      - key: PAYMENT_PROVIDER
        value: manual

databases:
  - name: ecommerce-pro-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
